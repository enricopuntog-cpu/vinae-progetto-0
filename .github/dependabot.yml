# Aggiornamenti automatici di versione (VPM-018-SEC-CI-01).
#
# Le PR di Dependabot passano dagli stessi check e dalla stessa review Code Owner
# di ogni altra PR: nessuna regola di merge automatico. Non ricevono i secret degli
# environment. Limiti bassi e gruppi per non sommergere la coda; attesa di 7 giorni
# dalla pubblicazione, per non adottare subito una versione compromessa e ritirata.
# I salti di versione maggiore si fanno a mano: restano esclusi solo dagli
# aggiornamenti di versione, non dagli eventuali avvisi di sicurezza.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /frontend-next
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minori:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minori:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      minori:
        update-types:
          - minor
          - patch
