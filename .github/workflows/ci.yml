name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  frontend-next:
    name: Frontend Next - lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend-next/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # `bun test` esce 1 se non trova alcun file di test, ma esce 0 se i file
      # ci sono e non contengono casi: verificato con bun 1.3.14. Il verde da
      # solo non dimostra quindi che i test siano stati eseguiti, e la soglia
      # qui sotto e' cio' che lo dimostra. Va alzata quando se ne aggiungono e
      # abbassata solo di proposito: e' l'unica cosa che si oppone a una suite
      # che si svuota in silenzio.
      - name: Test
        env:
          MIN_TESTS: "538"
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          passati=$(grep -oE '^ *[0-9]+ pass' "$RUNNER_TEMP/test-output.txt" | grep -oE '[0-9]+' | head -1)
          passati=${passati:-0}
          if [ "$passati" -lt "$MIN_TESTS" ]; then
            echo "::error::$passati test superati, ne erano attesi almeno $MIN_TESTS."
            exit 1
          fi
          echo "$passati test superati (soglia $MIN_TESTS)."

      - name: Build
        run: bun run build

  backend:
    name: Backend - lint, syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Lint Python
        run: python -m ruff check .

      - name: Run local mocked tests
        env:
          APP_ENV: test
        run: python -m pytest -q
