name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  frontend-next:
    name: Frontend Next - lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend-next/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun audit` resta un hard gate: il wrapper lo esegue e non ne filtra la
      # severity. Ammette per nome la sola GHSA-vfj7-8cjw-p6xm su braces 3.0.3
      # — advisory senza versione corretta pubblicata, raggiungibile solo da
      # tooling di sviluppo — e fallisce su qualunque altro avviso, su un
      # intervallo vulnerabile allargato, su una versione installata diversa, se
      # braces entra nel grafo di runtime o diventa dipendenza diretta, e su
      # output non interpretabile. I casi della policy girano prima del gate:
      # una policy rotta non puo' passare per verde.
      - name: Audit dependencies
        working-directory: .
        run: |
          node --check .github/scripts/frontend-next-audit.mjs
          node --test .github/scripts/frontend-next-audit.test.mjs
          node .github/scripts/frontend-next-audit.mjs

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # `bun test` esce 1 se non trova alcun file di test, ma esce 0 se i file
      # ci sono e non contengono casi: verificato con bun 1.3.14. Il verde da
      # solo non dimostra quindi che i test siano stati eseguiti, e la soglia
      # qui sotto e' cio' che lo dimostra. Va alzata quando se ne aggiungono e
      # abbassata solo di proposito: e' l'unica cosa che si oppone a una suite
      # che si svuota in silenzio.
      - name: Test
        env:
          MIN_TESTS: "2412"
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          passati=$(grep -oE '^ *[0-9]+ pass' "$RUNNER_TEMP/test-output.txt" | grep -oE '[0-9]+' | head -1)
          passati=${passati:-0}
          if [ "$passati" -lt "$MIN_TESTS" ]; then
            echo "::error::$passati test superati, ne erano attesi almeno $MIN_TESTS."
            exit 1
          fi
          echo "$passati test superati (soglia $MIN_TESTS)."

      - name: Build
        run: bun run build

  payout-runner:
    name: Payout runner - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # La suite usa solo il test runner integrato di Node: nessuna dipendenza
      # da installare, nessun secret, nessuna chiamata di rete. Il runner dei
      # payout non viene invocato contro Supabase e nessun payout viene emesso.
      - name: Test payout runner
        run: node --test .github/scripts/payouts-release-job.test.mjs

  continuity-scripts:
    name: Continuity scripts - syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # La guardia ispeziona ogni commit della branch, non solo l'ultimo:
          # serve la cronologia completa. Il repository e' piccolo e `fetch-depth:
          # 0` elimina l'ambiguita' su quanti commit siano disponibili.
          fetch-depth: 0
      # Rifiuta i quattro file personali dell'autore se compaiono nell'albero di
      # HEAD o in QUALUNQUE commit della branch rispetto alla base. Sta in questo
      # job perche' e' un check gia' obbligatorio sul ruleset di `main`: un job
      # nuovo non lo sarebbe finche' nessuno lo aggiunge al ruleset.
      #
      # Gli SHA arrivano dall'evento: su `pull_request` HEAD del checkout e' il
      # merge commit di prova, non il vero HEAD della branch. Su `push` il range
      # e' `before..after`.
      - name: Protected personal paths
        env:
          GUARDIA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUARDIA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: bash .github/scripts/protected-paths-guard.sh
      - name: Validate scripts
        run: |
          bash -n .github/scripts/offsite-backup.sh
          bash -n .github/scripts/offsite-backup-config.sh
          bash -n .github/scripts/offsite-backup-config.test.sh
          bash .github/scripts/offsite-backup-config.test.sh
          bash -n .github/scripts/offsite-restore-verify.sh
          node --check .github/scripts/offsite-backup-freshness.mjs
          node --test .github/scripts/offsite-backup-freshness.test.mjs
          bash .github/scripts/offsite-backup-freshness.cli.test.sh
          bash -n .github/scripts/supabase-db-gate-scope.sh
          bash -n .github/scripts/protected-paths-guard.sh
          bash -n .github/scripts/protected-paths-guard.test.sh
          bash .github/scripts/protected-paths-guard.test.sh
          bash -n supabase/tests/12g_ci_run.sh
          node --check supabase/tests/12g_club_dispute_e2e.mjs
          bash .github/scripts/supabase-db-gate.test.sh
          python3 .github/scripts/offsite-archive-validate.test.py
          node --check .github/scripts/export-supabase-storage.mjs
          node .github/scripts/status-page-check.mjs
          bash .github/scripts/status-page-check.test.sh

  backend:
    name: Backend - lint, syntax and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Lint Python
        run: python -m ruff check .

      - name: Run local mocked tests
        env:
          APP_ENV: test
        run: python -m pytest -q
