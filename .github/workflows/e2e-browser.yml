name: E2E browser

# Suite browser Playwright di frontend-next (VPM-LAB-003) su uno stack Supabase
# locale ed effimero costruito dalle migrazioni del commit, e su un'app costruita
# nel job con le flag Accessori accese nel solo processo di prova.
#
# Due livelli, volutamente separati per non rallentare ogni PR:
#   - smoke  (pull_request e push su main, solo per percorsi pertinenti):
#     Chromium desktop, casi marcati @smoke, circa 3 minuti compresa la build;
#   - completa (avvio manuale, suite=completa): Chromium desktop, Chromium 375 px
#     e WebKit, tutti i casi.
#
# Non e un check richiesto dal ruleset `main-protection`: ne il nome ne i
# trigger di quel ruleset cambiano. Non usa secret e non puo raggiungere la
# produzione: la suite rifiuta da sola ogni bersaglio che non sia lo stack E2E
# dedicato `vinea_e2e` creato da `e2e:stack up` nello stesso checkout, con il
# marcatore nel database (frontend-next/e2e/support/target.ts, VPM-018-FIX-E2E-01).
# Nessun bypass in CI: valgono le stesse prove di identita dello sviluppo locale.
# Procedura e limiti in docs/E2E_BROWSER.md.

on:
  pull_request:
    paths:
      - "frontend-next/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/12zk_*"
      - ".github/workflows/e2e-browser.yml"
  push:
    branches:
      - main
    paths:
      - "frontend-next/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/e2e-browser.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke (Chromium desktop, @smoke) oppure completa (tre progetti)"
        type: choice
        options:
          - smoke
          - completa
          - ux-prima
          - ux-final
        default: smoke

permissions:
  contents: read

concurrency:
  group: e2e-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E browser - Accessori (stack isolato)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend-next/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: frontend-next
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend-next
        run: |
          if [ "$SUITE" = "completa" ] || [[ "$SUITE" == ux-* ]]; then
            bun x playwright install --with-deps chromium webkit
          else
            bun x playwright install --with-deps chromium
          fi

      # Stesso comando dello sviluppo locale: progetto riservato `vinea_e2e`,
      # porte 553xx, marcatore di possesso nel database e file di identita.
      # Solo database, Auth, PostgREST, Storage e gateway, come il gate 12g;
      # l'output con le chiavi non viene stampato (errori filtrati dallo script).
      - name: Start dedicated E2E Supabase stack
        working-directory: frontend-next
        run: |
          for registry in "${SUPABASE_INTERNAL_IMAGE_REGISTRY:-ghcr.io}" public.ecr.aws; do
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" bun run e2e:stack up; then
              echo "Stack E2E dedicato avviato con le migrazioni del commit (immagini da $registry)."
              exit 0
            fi
            echo "::warning title=E2E browser::Avvio non riuscito con le immagini da $registry."
            # Runner effimero: si rimuove solo il progetto riservato, mai un project_id di sviluppo.
            npx --yes supabase@2.117.0 stop --no-backup --project-id vinea_e2e > /dev/null 2>&1 || true
          done
          echo "::error title=E2E browser::Stack Supabase E2E non avviato."
          exit 1

      - name: Run browser suite
        working-directory: frontend-next
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        # Il bersaglio si risolve dal file di identita scritto da `e2e:stack up`.
        # La pulizia finale deve risultare davvero eseguita: una corsa verde senza
        # la riga di pulizia e un errore.
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/e2e.log"
          if [ "$SUITE" = "ux-prima" ]; then
            VITE_BASELINE=1 bun run e2e ux-final 2>&1 | tee "$log"
          elif [ "$SUITE" = "ux-final" ]; then
            bun run e2e ux-final 2>&1 | tee "$log"
          elif [ "$SUITE" = "completa" ]; then
            bun run e2e 2>&1 | tee "$log"
          else
            bun run e2e:smoke 2>&1 | tee "$log"
          fi
          if ! grep -q '\[e2e\] pulizia completata' "$log"; then
            echo "::error title=E2E browser::La pulizia finale dello stack dedicato non risulta eseguita."
            exit 1
          fi

      - name: Summary
        if: always()
        working-directory: frontend-next
        run: |
          if [ -f e2e/artifacts/results.json ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync("e2e/artifacts/results.json", "utf8"));
              const s = r.stats ?? {};
              console.log(`E2E browser (${process.env.SUITE}): attesi ${s.expected ?? 0}, inattesi ${s.unexpected ?? 0}, instabili ${s.flaky ?? 0}, saltati ${s.skipped ?? 0}`);
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "E2E browser: nessun risultato (la suite non è partita)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Report, screenshot e trace dei casi: nessuna password. Gli accessi dei casi
      # avvengono in Node; `auth-critico` scrive nei moduli password nuove di
      # utenti effimeri con `scriviSegreto` (mai `fill`, il cui titolo finirebbe nel
      # report) e con trace, screenshot e video spenti. Restano sessioni di utenti
      # fittizi di uno stack che si distrugge.
      - name: Upload report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-browser-${{ env.SUITE }}
          path: frontend-next/e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore

      # `down` verifica etichetta e marcatore prima di `stop --no-backup --project-id vinea_e2e`.
      - name: Destroy dedicated E2E Supabase stack
        if: always()
        working-directory: frontend-next
        run: bun run e2e:stack down --conferma
