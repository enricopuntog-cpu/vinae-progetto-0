name: Vinea - technical heartbeat

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: vinea-technical-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check liveness and existing payout scheduler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAYOUTS_SCHEDULER_ENABLED: ${{ vars.PAYOUTS_SCHEDULER_ENABLED }}
        run: node .github/scripts/technical-heartbeat.mjs

  # WI-016: gli esiti di questo workflow come segnali al Company Brain, piu l'osservatore indipendente dell'heartbeat.
  # SPENTO finche la variabile VINEA_INGEST_ENABLED non e esattamente 'true'. Job SEPARATO: la sorveglianza qui sopra
  # resta senza environment e senza secret, quindi un guasto o un'approvazione di questo job non la tocca.
  # Prima di accendere (founder): environment `company-brain-ingest` ristretto al solo branch main, con i secret
  # VINEA_INGEST_DATABASE_URL (login membro SOLO di brain_ingest), VINEA_DB_CA_PEM (certificato pubblico) e, per
  # l'osservatore, VINEA_OBSERVER_DATABASE_URL (login membro SOLO di brain_monitor_read). Log pubblici: soli esiti.
  # GitHub puo ritardare le corse pianificate di ore: le cadenze attese delle fonti ne tengono conto.
  brain-signals:
    needs: heartbeat
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.VINEA_INGEST_ENABLED == 'true' }}
    environment: company-brain-ingest
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Send technical signals
        env:
          VINEA_INGEST_DATABASE_URL: ${{ secrets.VINEA_INGEST_DATABASE_URL }}
          VINEA_DB_CA_PEM: ${{ secrets.VINEA_DB_CA_PEM }}
          GITHUB_TOKEN: ${{ github.token }}
          HEARTBEAT_RESULT: ${{ needs.heartbeat.result }}
        run: bun tools/company-brain/raccogli-segnali.mjs

      # Rosso = il job fallisce e GitHub avvisa: e il solo canale che non dipende dal database sorvegliato.
      - name: Independent observer
        if: ${{ !cancelled() && vars.VINEA_OBSERVER_ENABLED == 'true' }}
        env:
          VINEA_OBSERVER_DATABASE_URL: ${{ secrets.VINEA_OBSERVER_DATABASE_URL }}
          VINEA_INGEST_DATABASE_URL: ${{ secrets.VINEA_INGEST_DATABASE_URL }}
          VINEA_DB_CA_PEM: ${{ secrets.VINEA_DB_CA_PEM }}
        run: bun tools/company-brain/osservatore.mjs
