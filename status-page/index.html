<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Stato dei servizi — Vinea</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #26211f; background: #f6f0e6; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); border: 1px solid #d8cdbd; border-radius: 24px; background: #fffdf8; padding: 32px; box-sizing: border-box; box-shadow: 0 16px 50px #3b252010; }
      h1 { margin: 0; font-family: Georgia, serif; color: #6f1831; font-size: clamp(2rem, 6vw, 3rem); }
      .status { margin-top: 24px; border-left: 5px solid #4f735e; padding: 16px 18px; background: #eef5ef; border-radius: 12px; }
      .status strong { display: block; margin-bottom: 6px; }
      p { line-height: 1.55; }
      small { color: #6d625d; }
    </style>
  </head>
  <body>
    <main>
      <small>Vinea Wine Club</small>
      <h1>Stato dei servizi</h1>
      <div class="status" role="status">
        <strong>Nessun incidente pubblicato</strong>
        <span>Questa pagina verrà aggiornata durante manutenzioni o interruzioni significative.</span>
      </div>
      <p><small>Per comunicazioni dirette relative a incidenti significativi Vinea usa anche l’email.</small></p>
    </main>
  </body>
</html>
