[build]
  base = "frontend-next"
  command = "bun run build"
  publish = ".next"

[build.environment]
  BUN_VERSION = "1.3.14"
  NODE_VERSION = "22"

# Security header post-audit del 17 settembre 2026.
# La CSP è in Report-Only: la versione enforcing con nonce via middleware è un
# passo successivo, da fare dopo aver letto le violazioni raccolte in produzione.
# Origini oltre a 'self': Supabase (REST/Auth/Storage via https, Realtime via
# wss, immagini pubbliche e firmate del bucket), Google Fonts (foglio di stile
# in layout.tsx e file dei font) e i.pravatar.cc (avatar dei dati dimostrativi).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://pijnmcllmfgjmgsvtcej.supabase.co https://i.pravatar.cc; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://pijnmcllmfgjmgsvtcej.supabase.co wss://pijnmcllmfgjmgsvtcej.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
